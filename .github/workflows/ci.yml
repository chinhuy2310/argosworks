name: ARGOS WORKS Enterprise CI/CD & Security Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          ARGOS_LICENSE_SECRET: "CI_TEST_LICENSE_SECRET_KEY_12345"
          ARGOS_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          JARVIS_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          python -m unittest discover -s tests -v

      - name: Python Syntax Gate (compileall)
        run: |
          python -m compileall -q server scripts

      - name: Frontend Syntax Gate (node --check)
        run: |
          find web -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Deployment Bootstrap Self-Test (--check)
        run: |
          cp .env.example .env
          python scripts/init_deploy.py
          python scripts/init_deploy.py --check

  test-postgres:
    name: PostgreSQL Compatibility (default engine)
    runs-on: ubuntu-latest
    # The shipped compose stack defaults to PostgreSQL, so it must be exercised.
    # This job is a blocking gate on purpose: a red run means the default
    # persistence path is broken and cannot be sold as "PostgreSQL supported".
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: argos_works
          POSTGRES_USER: argos_admin
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argos_admin -d argos_works"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Schema + Query Compatibility Smoke Test
        env:
          DATABASE_URL: "postgresql://argos_admin:ci_postgres_password@localhost:5432/argos_works"
          ARGOS_LICENSE_SECRET: "CI_TEST_LICENSE_SECRET_KEY_12345"
          ARGOS_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          python -m unittest discover -s tests -p "test_postgres*.py" -v

  security-scan:
    name: Security Scans (SAST & Vulnerability Audit)
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Static Security Analysis (Bandit)
        run: |
          pip install bandit
          bandit -r server/ -ll -ii -c .bandit

      - name: Semgrep SAST Analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
        # Advisory only: this third-party action is deprecated and its rule packs
        # change upstream without notice, so it must not gate a release.
        continue-on-error: true

  docker-build-verify:
    name: Container Build & SBOM Generation
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t argos-works:ci-test .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'argos-works:ci-test'
          format: 'table'
          # Blocking: a shipped image with a fixable CRITICAL/HIGH CVE must not
          # be published. ignore-unfixed keeps the gate actionable.
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-python-generate-sbom@v2
        with:
          input: requirements.txt
          output: sbom.json
        continue-on-error: true
