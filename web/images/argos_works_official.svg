<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Facet color definitions matching the official backup render -->
    <!-- Primary Cyan: #33aad3 / #22a4d3 -->
    <!-- Soft Glow Cyan: #7fccdf / #8ce0f2 -->
    <!-- Deep Oceanic Teal: #1a6f87 / #14596e -->
    <!-- Highlight Overlay: #a8e9f6 with opacity -->
    <linearGradient id="bandA_Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fccdf"/>
      <stop offset="50%" stop-color="#2ba6d4"/>
      <stop offset="100%" stop-color="#1b738e"/>
    </linearGradient>
    <linearGradient id="bandA_Right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b0dc"/>
      <stop offset="60%" stop-color="#227a96"/>
      <stop offset="100%" stop-color="#14556a"/>
    </linearGradient>
    <linearGradient id="bandW_Left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b728d"/>
      <stop offset="60%" stop-color="#32a9d6"/>
      <stop offset="100%" stop-color="#7ed0e4"/>
    </linearGradient>
    <linearGradient id="bandW_Right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15586d"/>
      <stop offset="60%" stop-color="#268fae"/>
      <stop offset="100%" stop-color="#6bc2d7"/>
    </linearGradient>
    <linearGradient id="centerTriangle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ce6f5"/>
      <stop offset="100%" stop-color="#3db5e0"/>
    </linearGradient>
  </defs>

  <!-- Group for the emblem -->
  <g id="logo-mark" transform="translate(0, -10)">
    <!-- 1. The Main Outer A-Pillars -->
    <!-- Top Apex Cap of A -->
    <polygon points="250,70 286,132 214,132" fill="#7fccdf" opacity="0.95"/>
    
    <!-- Left Leg of A -->
    <polygon points="250,70 214,132 108,316 72,316 214,70" fill="url(#bandA_Left)"/>
    
    <!-- Right Leg of A -->
    <polygon points="250,70 286,132 392,316 428,316 286,70" fill="url(#bandA_Right)"/>

    <!-- 2. The Interlocking W-Wings -->
    <!-- Left Wing of W extending upward -->
    <polygon points="84,180 146,180 220,316 170,316" fill="url(#bandW_Left)" opacity="0.88"/>
    <!-- Right Wing of W extending upward -->
    <polygon points="416,180 354,180 280,316 330,316" fill="url(#bandW_Right)" opacity="0.88"/>

    <!-- 3. Lower V Chevrons of W -->
    <!-- Left V Base -->
    <polygon points="144,316 182,316 212,368 174,368" fill="#1f7f9c"/>
    <polygon points="174,368 212,368 250,300 220,300" fill="#2eaad6"/>

    <!-- Right V Base -->
    <polygon points="356,316 318,316 288,368 326,368" fill="#186178"/>
    <polygon points="326,368 288,368 250,300 280,300" fill="#248fad"/>

    <!-- 4. Central Inverted Geometric Crossbar (The Focal Diamond/Triangle) -->
    <polygon points="214,242 286,242 250,304" fill="url(#centerTriangle)" opacity="0.95"/>
    <!-- Overlapping Inner Facet -->
    <polygon points="250,186 286,242 214,242" fill="#6bd2ea" opacity="0.8"/>
  </g>

  <!-- Typography: ARGOS WORKS -->
  <text x="250" y="440" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#82d3e7">ARGOS WORKS</text>
</svg>
